<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>StudyBuddy AI</title>
<script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --sb:#171717;
  --bg:#212121;
  --inp:#2f2f2f;
  --txt:#ececec;
  --sub:#8e8ea0;
  --bdr:#3d3d3d;
  --hov:#2a2a2a;
  --acc:#10a37f;
  --sw:260px;
}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);display:flex}

/* ── Sidebar ─────────────────────────────────── */
.sidebar{
  width:var(--sw);min-width:var(--sw);background:var(--sb);
  display:flex;flex-direction:column;border-right:1px solid var(--bdr);
  transition:transform .25s ease;
}
.sb-top{padding:10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--bdr)}
.logo-wrap{display:flex;align-items:center;gap:10px;flex:1}
.logo-icon{width:30px;height:30px;background:var(--acc);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.logo-name{font-size:15px;font-weight:600;color:var(--txt)}
.sb-toggle{background:transparent;border:none;color:var(--sub);cursor:pointer;padding:6px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.sb-toggle:hover{background:var(--hov);color:var(--txt)}
.new-btn{margin:10px;background:transparent;border:1px solid var(--bdr);color:var(--txt);padding:9px 14px;border-radius:10px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:8px;transition:background .15s;width:calc(100% - 20px)}
.new-btn:hover{background:var(--hov)}
.sb-label{font-size:10px;color:var(--sub);padding:8px 14px 4px;text-transform:uppercase;letter-spacing:.06em}
.chat-list{flex:1;overflow-y:auto;padding:4px 8px}
.chat-item{padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .12s,color .12s;margin-bottom:2px;display:flex;align-items:center;gap:7px}
.chat-item:hover{background:var(--hov);color:var(--txt)}
.chat-item.active{background:var(--hov);color:var(--txt)}
.doc-section{padding:8px 10px 12px;border-top:1px solid var(--bdr)}
.doc-item{display:flex;align-items:center;gap:7px;padding:3px 4px;font-size:12px;color:var(--sub);border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-footer{padding:10px 14px;border-top:1px solid var(--bdr);font-size:11px;color:var(--sub)}

/* ── Main ─────────────────────────────────────── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;min-width:0}

/* header bar */
.topbar{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bdr);gap:10px;flex-shrink:0}
.topbar-title{font-size:14px;font-weight:500;color:var(--sub)}

/* chat scroll area */
.chat-scroll{flex:1;overflow-y:auto;scroll-behavior:smooth}
.chat-wrap{max-width:768px;margin:0 auto;padding:20px 24px 160px}

/* welcome */
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;padding:32px 16px}
.wlc-logo{width:56px;height:56px;background:var(--acc);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:18px}
.wlc-h{font-size:26px;font-weight:600;margin-bottom:8px}
.wlc-sub{font-size:14px;color:var(--sub);margin-bottom:32px;max-width:380px;line-height:1.5}
.prompts{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:560px;width:100%}
.prompt-card{background:var(--inp);border:1px solid var(--bdr);border-radius:14px;padding:14px 16px;text-align:left;cursor:pointer;transition:background .15s,border-color .15s}
.prompt-card:hover{background:var(--hov);border-color:#555}
.prompt-card .pi{font-size:18px;margin-bottom:5px}
.prompt-card .pt{font-size:13px;font-weight:500;color:var(--txt);margin-bottom:2px}
.prompt-card .ps{font-size:12px;color:var(--sub)}

/* messages */
.msg{display:flex;gap:14px;padding:14px 0;animation:fadeUp .25s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg-av{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;margin-top:3px}
.msg.user .msg-av{background:#5436da;color:#fff}
.msg.assistant .msg-av{background:var(--acc);color:#fff;font-size:16px}
.msg-body{flex:1;min-width:0}
.msg-name{font-size:13px;font-weight:600;color:var(--txt);margin-bottom:5px}
.msg-text{font-size:15px;line-height:1.7;color:var(--txt)}
.msg.user .msg-text{background:var(--inp);border-radius:14px;padding:11px 16px;display:inline-block;max-width:88%;line-height:1.55}
/* Markdown in assistant */
.msg-text p{margin-bottom:10px}.msg-text p:last-child{margin-bottom:0}
.msg-text h1,.msg-text h2,.msg-text h3{margin:14px 0 7px;font-weight:600}
.msg-text h1{font-size:19px}.msg-text h2{font-size:16px}.msg-text h3{font-size:14px}
.msg-text ul,.msg-text ol{margin:8px 0 8px 22px}
.msg-text li{margin-bottom:4px}
.msg-text code{background:#1a1a2e;padding:2px 6px;border-radius:5px;font-family:Monaco,Menlo,monospace;font-size:13px;color:#e2e8f0}
.msg-text pre{background:#1a1a2e;border-radius:10px;padding:16px;overflow-x:auto;margin:12px 0}
.msg-text pre code{background:none;padding:0}
.msg-text strong{font-weight:600}
.msg-text em{font-style:italic}
.msg-text blockquote{border-left:3px solid var(--acc);padding-left:12px;color:var(--sub);margin:8px 0}
.msg-text table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px}
.msg-text th,.msg-text td{padding:8px 12px;border:1px solid var(--bdr);text-align:left}
.msg-text th{background:var(--inp);font-weight:600}
.msg-text a{color:var(--acc);text-decoration:none}
.msg-text a:hover{text-decoration:underline}
.msg-text hr{border:none;border-top:1px solid var(--bdr);margin:12px 0}
/* sources */
.sources{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.src{background:rgba(16,163,127,.1);border:1px solid rgba(16,163,127,.25);color:var(--acc);padding:3px 10px;border-radius:20px;font-size:11px;display:flex;align-items:center;gap:4px}
/* thinking dots */
.dots{display:flex;gap:4px;padding:4px 0}
.dot{width:7px;height:7px;background:var(--acc);border-radius:50%;animation:bob 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes bob{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}

/* ── Input area ───────────────────────────────── */
.input-zone{
  position:absolute;bottom:0;left:0;right:0;
  padding:14px 24px 18px;
  background:linear-gradient(transparent,var(--bg) 38%);
}
.input-inner{max-width:768px;margin:0 auto}
.file-pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.file-pill{
  display:flex;align-items:center;gap:6px;
  background:var(--inp);border:1px solid var(--bdr);
  border-radius:8px;padding:4px 10px;font-size:12px;color:var(--txt)
}
.rm-pill{cursor:pointer;color:var(--sub);font-size:15px;line-height:1;transition:color .12s}
.rm-pill:hover{color:#ff6b6b}
/* upload progress */
.up-progress{
  display:flex;align-items:center;gap:10px;
  background:rgba(16,163,127,.08);border:1px solid rgba(16,163,127,.2);
  border-radius:10px;padding:8px 14px;margin-bottom:8px;font-size:13px;color:var(--acc);
}
.prog-bar-wrap{flex:1;background:var(--bdr);border-radius:4px;height:3px;overflow:hidden}
.prog-bar{height:100%;background:var(--acc);border-radius:4px;width:0;transition:width .4s}
/* input box */
.ibox{
  background:var(--inp);border:1px solid var(--bdr);border-radius:16px;
  display:flex;align-items:flex-end;gap:8px;padding:11px 10px 11px 16px;
  transition:border-color .2s;
}
.ibox:focus-within{border-color:#555}
#inp{
  flex:1;background:transparent;border:none;outline:none;
  color:var(--txt);font-size:15px;resize:none;
  max-height:200px;min-height:24px;line-height:1.55;font-family:inherit;
}
#inp::placeholder{color:var(--sub)}
.ibtn{
  width:34px;height:34px;border-radius:10px;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0;
}
.ibtn.attach{background:transparent;color:var(--sub)}
.ibtn.attach:hover{background:var(--hov);color:var(--txt)}
.ibtn.send{background:var(--acc);color:#fff}
.ibtn.send:hover{background:#0d8c6d}
.ibtn.send:disabled{background:var(--bdr);cursor:not-allowed;color:var(--sub)}
.hint{text-align:center;font-size:11px;color:var(--sub);margin-top:7px}

/* ── Toast ───────────────────────────────────── */
.toasts{position:fixed;top:18px;right:18px;z-index:999;display:flex;flex-direction:column;gap:8px}
.toast{
  background:var(--inp);border:1px solid var(--bdr);color:var(--txt);
  padding:10px 16px;border-radius:10px;font-size:13px;
  animation:slideIn .25s ease;max-width:300px;line-height:1.4;
}
.toast.ok{border-color:var(--acc);color:var(--acc)}
.toast.err{border-color:#ff6b6b;color:#ff6b6b}
@keyframes slideIn{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}

/* scrollbar */
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#404040;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#505050}

@media(max-width:700px){
  .sidebar{display:none}
  .prompts{grid-template-columns:1fr}
  .chat-wrap{padding:16px 16px 160px}
}
</style>
</head>
<body>

<!-- ═══ SIDEBAR ═══════════════════════════════════ -->
<aside class="sidebar" id="sidebar">
  <div class="sb-top">
    <div class="logo-wrap">
      <div class="logo-icon">📚</div>
      <span class="logo-name">StudyBuddy</span>
    </div>
    <button class="sb-toggle" onclick="toggleSidebar()" title="Collapse sidebar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
    </button>
  </div>

  <button class="new-btn" onclick="newChat()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    New chat
  </button>

  <div class="sb-label">Recents</div>
  <div class="chat-list" id="chatList"></div>

  <div class="doc-section" id="docSection">
    <div class="sb-label" style="padding:0 0 6px">Indexed Files</div>
    <div id="docList"><div class="doc-item" style="font-style:italic;font-size:11px">No files indexed yet</div></div>
  </div>

  <div class="sb-footer">🎓 Answers only from your documents</div>
</aside>

<!-- ═══ MAIN ══════════════════════════════════════ -->
<div class="main">
  <div class="topbar">
    <button class="sb-toggle" onclick="toggleSidebar()" title="Toggle sidebar" style="display:none" id="openSbBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
    </button>
    <span class="topbar-title" id="topTitle">New conversation</span>
  </div>

  <div class="chat-scroll" id="chatScroll">
    <div class="chat-wrap" id="chatWrap">
      <!-- Welcome injected here -->
    </div>
  </div>

  <!-- Input zone -->
  <div class="input-zone">
    <div class="input-inner">
      <div class="file-pills" id="filePills"></div>
      <div class="up-progress" id="upProgress" style="display:none">
        <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
        <span id="upLabel">Uploading…</span>
        <div class="prog-bar-wrap"><div class="prog-bar" id="progBar"></div></div>
      </div>
      <div class="ibox">
        <textarea id="inp" rows="1" placeholder="Ask about your study material…"
          oninput="resize(this)" onkeydown="onKey(event)"></textarea>
        <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
          <input type="file" id="fileInput" multiple accept=".pdf,.png,.jpg,.jpeg,.webp" style="display:none" onchange="onFiles(event)"/>
          <button class="ibtn attach" onclick="document.getElementById('fileInput').click()" title="Attach PDF or image">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
            </svg>
          </button>
          <button class="ibtn send" id="sendBtn" onclick="send()" disabled title="Send">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </div>
      </div>
      <div class="hint">StudyBuddy answers strictly from your uploaded documents · Shift+Enter for new line</div>
    </div>
  </div>
</div>

<!-- Toast container -->
<div class="toasts" id="toasts"></div>

<script>
// ── Config ──────────────────────────────────────
const API = window.location.origin; // same-origin — no CORS needed

// ── State ───────────────────────────────────────
let sid        = uid();
let attached   = [];       // File[] waiting to be uploaded
let loading    = false;
let chatId     = null;
let chats      = load('sb_chats',  []);
let docs       = load('sb_docs',   []);
let sidebarOpen= true;

// ── Boot ────────────────────────────────────────
marked.setOptions({breaks:true,gfm:true});

document.getElementById('inp').addEventListener('input', syncBtn);
renderChatList();
renderDocs();
showWelcome();

// ── Helpers ─────────────────────────────────────
function uid(){ return Math.random().toString(36).slice(2)+Date.now().toString(36) }
function load(k,d){ try{return JSON.parse(localStorage.getItem(k))||d}catch{return d} }
function save(k,v){ try{localStorage.setItem(k,JSON.stringify(v))}catch{} }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }
function ext(name){ return (name.split('.').pop()||'').toLowerCase() }
function icon(name){ const e=ext(name); if(e==='pdf')return'📄'; if(['png','jpg','jpeg','webp'].includes(e))return'🖼️'; return'📎' }

function syncBtn(){
  document.getElementById('sendBtn').disabled = !document.getElementById('inp').value.trim() || loading;
}

function resize(el){
  el.style.height='auto';
  el.style.height=Math.min(el.scrollHeight,200)+'px';
}

function onKey(e){
  if(e.key==='Enter'&&!e.shiftKey){
    e.preventDefault();
    if(!document.getElementById('sendBtn').disabled) send();
  }
}

function usePrompt(t){
  const i=document.getElementById('inp');
  i.value=t; resize(i); syncBtn(); i.focus();
}

// ── Sidebar ─────────────────────────────────────
function toggleSidebar(){
  sidebarOpen=!sidebarOpen;
  const sb=document.getElementById('sidebar');
  const ob=document.getElementById('openSbBtn');
  if(sidebarOpen){
    sb.style.display='flex';
    ob.style.display='none';
  } else {
    sb.style.display='none';
    ob.style.display='flex';
  }
}

// ── Welcome screen ───────────────────────────────
function showWelcome(){
  document.getElementById('chatWrap').innerHTML=`
    <div class="welcome">
      <div class="wlc-logo">📚</div>
      <h1 class="wlc-h">StudyBuddy AI</h1>
      <p class="wlc-sub">Upload your PDFs or photos of notes, then ask anything. I'll help you prepare for your exam like a knowledgeable friend.</p>
      <div class="prompts">
        <div class="prompt-card" onclick="usePrompt('Summarize the key concepts from my notes')">
          <div class="pi">📝</div><div class="pt">Summarize key concepts</div><div class="ps">from my uploaded notes</div>
        </div>
        <div class="prompt-card" onclick="usePrompt('Explain this topic in simple terms')">
          <div class="pi">💡</div><div class="pt">Explain in simple terms</div><div class="ps">any topic from the material</div>
        </div>
        <div class="prompt-card" onclick="usePrompt('What are the important formulas I should remember for the exam?')">
          <div class="pi">🔢</div><div class="pt">Important formulas</div><div class="ps">to remember for the exam</div>
        </div>
        <div class="prompt-card" onclick="usePrompt('Quiz me on this chapter with 5 questions')">
          <div class="pi">🧠</div><div class="pt">Quiz me on this chapter</div><div class="ps">test my understanding</div>
        </div>
      </div>
    </div>`;
}

// ── File handling ────────────────────────────────
function onFiles(e){
  Array.from(e.target.files).forEach(f=>{
    if(!attached.find(x=>x.name===f.name)) attached.push(f);
  });
  e.target.value='';
  renderPills();
  syncBtn();
}

function renderPills(){
  document.getElementById('filePills').innerHTML=attached.map((f,i)=>`
    <div class="file-pill">
      ${icon(f.name)} <span style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.name)}</span>
      <span class="rm-pill" onclick="rmFile(${i})">×</span>
    </div>`).join('');
}

function rmFile(i){ attached.splice(i,1); renderPills(); }

// ── Upload ───────────────────────────────────────
async function upload(){
  if(!attached.length) return;
  const pb=document.getElementById('progBar');
  const up=document.getElementById('upProgress');
  const lbl=document.getElementById('upLabel');
  up.style.display='flex'; pb.style.width='20%';

  const fd=new FormData();
  attached.forEach(f=>fd.append('files',f));

  lbl.textContent='Uploading files…'; pb.style.width='40%';
  const res=await fetch(`${API}/upload`,{method:'POST',body:fd});
  pb.style.width='80%'; lbl.textContent='Indexing chunks…';

  if(!res.ok){
    const e=await res.json().catch(()=>({detail:'Upload failed'}));
    up.style.display='none'; pb.style.width='0';
    throw new Error(e.detail||'Upload failed');
  }
  const data=await res.json();
  pb.style.width='100%';

  attached.forEach(f=>{ if(!docs.includes(f.name)) docs.push(f.name); });
  save('sb_docs',docs); renderDocs();
  toast(`✅ Indexed ${data.chunks_indexed} chunks from ${data.stored_files.length} file(s)`,'ok');

  attached=[]; renderPills();
  setTimeout(()=>{ up.style.display='none'; pb.style.width='0'; },600);
}

// ── Send ─────────────────────────────────────────
async function send(){
  const inp=document.getElementById('inp');
  const q=inp.value.trim();
  if(!q||loading) return;

  // hide welcome
  document.querySelector('.welcome')?.remove();

  inp.value=''; inp.style.height='auto'; syncBtn();

  // Upload attached files first
  if(attached.length){
    try{ await upload(); }
    catch(err){ toast('Upload error: '+err.message,'err'); return; }
  }

  // First message → create chat record
  if(!chatId){
    chatId=uid();
    chats.unshift({id:chatId,title:q.slice(0,55),sid,ts:Date.now()});
    save('sb_chats',chats);
    renderChatList();
  }
  document.getElementById('topTitle').textContent=chats.find(c=>c.id===chatId)?.title||'Chat';

  addMsg('user',q);
  const think=addThinking();

  loading=true; syncBtn();
  try{
    const res=await fetch(`${API}/ask`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({session_id:sid,question:q}),
    });
    if(!res.ok){
      const e=await res.json().catch(()=>({detail:'Server error'}));
      throw new Error(e.detail||`HTTP ${res.status}`);
    }
    const d=await res.json();
    think.remove();
    addMsg('assistant',d.answer,d.sources);
  } catch(err){
    think.remove();
    addMsg('assistant','⚠️ '+err.message,[]);
    toast(err.message,'err');
  }
  loading=false; syncBtn();
}

// ── Message rendering ────────────────────────────
function addMsg(role,text,sources=[]){
  const wrap=document.getElementById('chatWrap');
  const d=document.createElement('div');
  d.className=`msg ${role}`;

  const av=role==='user'?'U':'📚';
  const name=role==='user'?'You':'StudyBuddy';
  const body=role==='assistant'?marked.parse(text):`<span>${esc(text)}</span>`;

  let srcHtml='';
  if(sources&&sources.length){
    srcHtml='<div class="sources">'+sources.map(s=>`<span class="src">📄 ${esc(s)}</span>`).join('')+'</div>';
  }

  d.innerHTML=`
    <div class="msg-av">${av}</div>
    <div class="msg-body">
      <div class="msg-name">${name}</div>
      <div class="msg-text">${body}</div>
      ${srcHtml}
    </div>`;

  wrap.appendChild(d);
  d.querySelectorAll('pre code').forEach(b=>hljs.highlightElement(b));
  scrollBottom();
}

function addThinking(){
  const wrap=document.getElementById('chatWrap');
  const d=document.createElement('div');
  d.className='msg assistant';
  d.innerHTML=`
    <div class="msg-av">📚</div>
    <div class="msg-body">
      <div class="msg-name">StudyBuddy</div>
      <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    </div>`;
  wrap.appendChild(d);
  scrollBottom();
  return d;
}

function scrollBottom(){
  const s=document.getElementById('chatScroll');
  s.scrollTop=s.scrollHeight;
}

// ── New chat ─────────────────────────────────────
function newChat(){
  chatId=null; sid=uid(); loading=false;
  document.getElementById('topTitle').textContent='New conversation';
  document.querySelectorAll('.chat-item').forEach(e=>e.classList.remove('active'));
  fetch(`${API}/session/clear?session_id=${sid}`,{method:'POST'}).catch(()=>{});
  showWelcome();
}

// ── Chat list ────────────────────────────────────
function renderChatList(){
  const el=document.getElementById('chatList');
  if(!chats.length){
    el.innerHTML='<div class="doc-item" style="font-size:12px;font-style:italic">No previous chats</div>';
    return;
  }
  el.innerHTML=chats.slice(0,30).map(c=>`
    <div class="chat-item ${c.id===chatId?'active':''}" onclick="loadChat('${c.id}')" title="${esc(c.title)}">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
      ${esc(c.title)}
    </div>`).join('');
}

function loadChat(id){
  const c=chats.find(x=>x.id===id);
  if(!c) return;
  chatId=c.id; sid=c.sid;
  document.getElementById('topTitle').textContent=c.title;
  document.querySelectorAll('.chat-item').forEach(e=>e.classList.remove('active'));
  document.querySelector(`.chat-item[onclick="loadChat('${id}')"]`)?.classList.add('active');
  // Clear chat area and show a note (full history would need backend storage)
  document.getElementById('chatWrap').innerHTML=`
    <div style="text-align:center;padding:60px 24px;color:var(--sub);font-size:14px">
      <div style="font-size:24px;margin-bottom:12px">💬</div>
      <p>Session restored. Continue your conversation about <strong style="color:var(--txt)">"${esc(c.title)}"</strong></p>
    </div>`;
}

// ── Doc list ─────────────────────────────────────
function renderDocs(){
  const el=document.getElementById('docList');
  if(!docs.length){
    el.innerHTML='<div class="doc-item" style="font-size:11px;font-style:italic">No files indexed yet</div>';
    return;
  }
  el.innerHTML=docs.slice(-12).reverse().map(n=>`
    <div class="doc-item" title="${esc(n)}">${icon(n)} ${esc(n.length>22?n.slice(0,22)+'…':n)}</div>`).join('');
}

// ── Toast ────────────────────────────────────────
function toast(msg,type=''){
  const c=document.getElementById('toasts');
  const t=document.createElement('div');
  t.className=`toast ${type}`;
  t.textContent=msg;
  c.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300); },4000);
}
</script>
</body>
</html>
